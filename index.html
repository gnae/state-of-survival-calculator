

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State of Survival Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #10131a;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #191f2b;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #30394a;
        }

        h1 {
            margin: 0;
            color: #62a5ff;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #191f2b;
            border: 1px solid #30394a;
            border-radius: 12px;
            padding: 30px;
            margin-top: 25px;
        }

        .status {
            color: #8d99aa;
        }
    </style>
</head>

<body>

    <header>
        <h1>State of Survival</h1>
        <p>Gaming Calculators</p>
    </header>

    <main>
        <h2>Welcome!</h2>
        <p class="status">
            Your troop training calculator is coming soon.
        </p>

        <div class="card">
            <h2>Troop Training Calculator</h2>
            <p>Under development...</p>
        </div>
    </main>

</body>
</html>
